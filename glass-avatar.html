<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glass Avatar</title>
  <script src="https://unpkg.com/@rive-app/canvas@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 20px;
    }

    .avatars-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      max-width: 800px;
    }

    .avatar-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .avatar-container {
      position: relative;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      overflow: hidden;
      cursor: pointer;
      box-shadow:
        0 8px 32px rgba(0,0,0,0.4),
        0 2px 8px rgba(0,0,0,0.3),
        inset 0 1px 1px rgba(255,255,255,0.1);
      transition: transform 0.05s;
    }

    .avatar-container canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border-radius: 50%;
    }

    .avatar-name {
      font-size: 11px;
      color: rgba(255,255,255,0.5);
    }

    .avatar-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      width: 100%;
    }

    .eye-row {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .eye-dot {
      width: 20px; height: 20px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.2);
      cursor: pointer;
      transition: all 0.2s;
    }
    .eye-dot:hover { border-color: rgba(255,255,255,0.5); }
    .eye-dot.active { border-color: #fff; box-shadow: 0 0 6px rgba(255,255,255,0.3); }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 4px;
      width: 100%;
    }
    .slider-row label {
      font-size: 9px;
      color: rgba(255,255,255,0.35);
      width: 24px;
      text-align: right;
      flex-shrink: 0;
    }
    .slider-row input[type="range"] {
      flex: 1;
      height: 3px;
      -webkit-appearance: none;
      background: rgba(255,255,255,0.15);
      border-radius: 2px;
      outline: none;
    }
    .slider-row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #6d83f2;
      cursor: pointer;
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .emotion-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .emotion-btn {
      padding: 10px 20px;
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 24px;
      background: rgba(255,255,255,0.05);
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      backdrop-filter: blur(4px);
    }
    .emotion-btn:hover {
      border-color: rgba(255,255,255,0.5);
      background: rgba(255,255,255,0.1);
    }
    .emotion-btn.active {
      border-color: #6d83f2;
      background: rgba(109,131,242,0.2);
      color: #a8b8ff;
    }

    .label {
      font-size: 12px;
      color: rgba(255,255,255,0.4);
    }
  </style>
</head>
<body>

  <div class="label">tap avatar to wiggle</div>

  <div class="avatars-grid" id="avatars-grid"></div>

  <div class="controls">
    <div class="emotion-buttons" id="emotion-buttons">
      <button class="emotion-btn active" data-val="0">normal</button>
      <button class="emotion-btn" data-val="1">umm</button>
      <button class="emotion-btn" data-val="2">wink</button>
      <button class="emotion-btn" data-val="3">angry</button>
      <button class="emotion-btn" data-val="4">sad</button>
    </div>
  </div>

  <script>
    const AVATARS = [
      { src: 'nagai.jpeg', name: 'nagai' },
      { src: 'okuda.png', name: 'okuda' },
      { src: 'aoyama.png', name: 'aoyama' },
      { src: 'uema.jpeg', name: 'uema' },
    ];

    const SIZE = 320;
    const CENTER = SIZE / 2;
    const RADIUS = SIZE / 2;
    const LIGHT_X = -0.4;
    const LIGHT_Y = -0.5;

    const avatarInstances = [];

    function loadImage(src) {
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = src;
      });
    }

    function createAvatar(config, index) {
      const wrapper = document.createElement('div');
      wrapper.className = 'avatar-wrapper';

      const container = document.createElement('div');
      container.className = 'avatar-container';

      const glassCanvas = document.createElement('canvas');
      glassCanvas.className = 'glass-canvas';
      glassCanvas.width = SIZE; glassCanvas.height = SIZE;

      const riveCanvas = document.createElement('canvas');
      riveCanvas.className = 'rive-canvas';
      riveCanvas.width = SIZE; riveCanvas.height = SIZE;

      container.appendChild(glassCanvas);
      container.appendChild(riveCanvas);

      const nameLabel = document.createElement('div');
      nameLabel.className = 'avatar-name';
      nameLabel.textContent = config.name;

      // Per-avatar controls
      const ctrlDiv = document.createElement('div');
      ctrlDiv.className = 'avatar-controls';

      // Eye color row
      const eyeRow = document.createElement('div');
      eyeRow.className = 'eye-row';
      const whiteDot = document.createElement('div');
      whiteDot.className = 'eye-dot active';
      whiteDot.style.background = '#ffffff';
      whiteDot.dataset.color = '#ffffff';
      const picker = document.createElement('input');
      picker.type = 'color';
      picker.value = '#6dcff6';
      picker.style.cssText = 'width:20px;height:20px;border:none;border-radius:50%;cursor:pointer;padding:0;background:none;-webkit-appearance:none;';
      eyeRow.appendChild(whiteDot);
      eyeRow.appendChild(picker);
      ctrlDiv.appendChild(eyeRow);

      // Blur slider
      const blurRow = document.createElement('div');
      blurRow.className = 'slider-row';
      const blurLabel = document.createElement('label');
      blurLabel.textContent = 'blur';
      const blurSlider = document.createElement('input');
      blurSlider.type = 'range'; blurSlider.min = '0'; blurSlider.max = '20'; blurSlider.value = '6'; blurSlider.step = '1';
      blurRow.appendChild(blurLabel);
      blurRow.appendChild(blurSlider);
      ctrlDiv.appendChild(blurRow);

      // Scale slider
      const scaleRow = document.createElement('div');
      scaleRow.className = 'slider-row';
      const scaleLabel = document.createElement('label');
      scaleLabel.textContent = 'size';
      const scaleSlider = document.createElement('input');
      scaleSlider.type = 'range'; scaleSlider.min = '50'; scaleSlider.max = '200'; scaleSlider.value = '110'; scaleSlider.step = '5';
      scaleRow.appendChild(scaleLabel);
      scaleRow.appendChild(scaleSlider);
      ctrlDiv.appendChild(scaleRow);

      // X offset slider
      const xRow = document.createElement('div');
      xRow.className = 'slider-row';
      const xLabel = document.createElement('label');
      xLabel.textContent = 'x';
      const xSlider = document.createElement('input');
      xSlider.type = 'range'; xSlider.min = '-50'; xSlider.max = '50'; xSlider.value = '0'; xSlider.step = '1';
      xRow.appendChild(xLabel);
      xRow.appendChild(xSlider);
      ctrlDiv.appendChild(xRow);

      // Y offset slider
      const yRow = document.createElement('div');
      yRow.className = 'slider-row';
      const yLabel = document.createElement('label');
      yLabel.textContent = 'y';
      const ySlider = document.createElement('input');
      ySlider.type = 'range'; ySlider.min = '-50'; ySlider.max = '50'; ySlider.value = '0'; ySlider.step = '1';
      yRow.appendChild(yLabel);
      yRow.appendChild(ySlider);
      ctrlDiv.appendChild(yRow);

      wrapper.appendChild(container);
      wrapper.appendChild(nameLabel);
      wrapper.appendChild(ctrlDiv);

      const instance = {
        container,
        glassCanvas,
        glassCtx: glassCanvas.getContext('2d', { willReadFrequently: true }),
        riveCanvas,
        moyaCanvas: Object.assign(document.createElement('canvas'), { width: SIZE, height: SIZE }),
        sourceImage: null,
        riveInstance: null,
        emotionInput: null,
        eyeColorInput: null,
        imgBlur: 6,
        imgScale: 110,
        imgOffsetX: 0,
        imgOffsetY: 0,
        whiteDot,
        picker,
      };
      instance.moyaCtx = instance.moyaCanvas.getContext('2d');

      // Slider events
      blurSlider.addEventListener('input', () => { instance.imgBlur = +blurSlider.value; });
      scaleSlider.addEventListener('input', () => { instance.imgScale = +scaleSlider.value; });
      xSlider.addEventListener('input', () => { instance.imgOffsetX = +xSlider.value; });
      ySlider.addEventListener('input', () => { instance.imgOffsetY = +ySlider.value; });

      // Eye color events — set via Rive ViewModel Data Binding
      whiteDot.addEventListener('click', () => {
        whiteDot.classList.add('active');
        setEyeColor(instance, '#ffffff');
      });
      picker.addEventListener('input', () => {
        whiteDot.classList.remove('active');
        setEyeColor(instance, picker.value);
      });

      // Jiggle
      let jiggleAnim = null;
      container.addEventListener('click', () => {
        if (jiggleAnim) cancelAnimationFrame(jiggleAnim);
        const start = performance.now();
        function jiggle(now) {
          const t = (now - start) / 600;
          if (t > 1) { container.style.transform = 'scale(1,1)'; jiggleAnim = null; return; }
          const d = Math.exp(-t * 4);
          const f = t * Math.PI * 5;
          container.style.transform = `scale(${1 + Math.sin(f) * 0.08 * d},${1 - Math.sin(f) * 0.08 * d})`;
          jiggleAnim = requestAnimationFrame(jiggle);
        }
        jiggleAnim = requestAnimationFrame(jiggle);
      });

      avatarInstances.push(instance);
      return { wrapper, instance };
    }

    function hexToRiveColor(hex) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return (0xFF << 24 | r << 16 | g << 8 | b) | 0;
    }

    function setEyeColor(inst, hex) {
      if (!inst.eyeColorInput) return;
      inst.eyeColorInput.value = hexToRiveColor(hex);
    }

    function renderMoyaLayer(inst, time) {
      const { moyaCtx, sourceImage } = inst;
      moyaCtx.clearRect(0, 0, SIZE, SIZE);
      const layers = [
        { scale: 1.8, rot: time * 0.00015, ox: 0, oy: 0 },
        { scale: 1.3, rot: -time * 0.0001, ox: Math.sin(time * 0.0006) * 8, oy: Math.cos(time * 0.0006) * 8 },
        { scale: 0.9, rot: time * 0.0002, ox: Math.cos(time * 0.0008) * 12, oy: Math.sin(time * 0.0008) * 12 },
      ];
      moyaCtx.filter = 'blur(40px) saturate(1.8) brightness(0.8)';
      layers.forEach(l => {
        moyaCtx.save();
        moyaCtx.translate(CENTER + l.ox, CENTER + l.oy);
        moyaCtx.rotate(l.rot);
        const s = RADIUS * 2 * l.scale;
        moyaCtx.drawImage(sourceImage, -s / 2, -s / 2, s, s);
        moyaCtx.restore();
      });
      moyaCtx.filter = 'none';
    }

    function renderGlassSphere(inst, time) {
      if (!inst.sourceImage) return;
      const { glassCtx, sourceImage, moyaCanvas } = inst;

      renderMoyaLayer(inst, time);
      glassCtx.clearRect(0, 0, SIZE, SIZE);
      glassCtx.save();

      glassCtx.beginPath();
      glassCtx.arc(CENTER, CENTER, RADIUS - 1, 0, Math.PI * 2);
      glassCtx.clip();

      glassCtx.drawImage(moyaCanvas, 0, 0);

      // Original image overlay with per-avatar blur, scale, offset
      glassCtx.globalAlpha = 0.25;
      const blurVal = inst.imgBlur;
      glassCtx.filter = `blur(${blurVal}px) brightness(0.95)`;

      const scalePct = inst.imgScale / 100;
      const imgAspect = sourceImage.width / sourceImage.height;
      let drawW, drawH;
      if (imgAspect > 1) {
        drawH = SIZE * scalePct;
        drawW = drawH * imgAspect;
      } else {
        drawW = SIZE * scalePct;
        drawH = drawW / imgAspect;
      }
      const ox = inst.imgOffsetX * (SIZE / 100);
      const oy = inst.imgOffsetY * (SIZE / 100);
      glassCtx.drawImage(sourceImage, (SIZE - drawW) / 2 + ox, (SIZE - drawH) / 2 + oy, drawW, drawH);
      glassCtx.filter = 'none';
      glassCtx.globalAlpha = 1.0;

      // Spherical refraction + chromatic aberration
      const imageData = glassCtx.getImageData(0, 0, SIZE, SIZE);
      const src = new Uint8ClampedArray(imageData.data);
      const dst = imageData.data;

      for (let y = 0; y < SIZE; y++) {
        for (let x = 0; x < SIZE; x++) {
          const dx = (x - CENTER) / RADIUS;
          const dy = (y - CENTER) / RADIUS;
          const dist2 = dx * dx + dy * dy;
          if (dist2 > 1) continue;

          const dist = Math.sqrt(dist2);
          const z = Math.sqrt(1 - dist2);
          const dIdx = (y * SIZE + x) * 4;

          const refr = 0.18 + 0.35 * dist2;
          const aberration = dist2 * dist * 0.03;

          for (let ch = 0; ch < 3; ch++) {
            const chrShift = ch === 0 ? -aberration : ch === 2 ? aberration : 0;
            const nx = dx * (1 - refr * z) + chrShift;
            const ny = dy * (1 - refr * z) + chrShift * 0.5;
            const srcX = Math.round((nx * 0.5 + 0.5) * SIZE);
            const srcY = Math.round((ny * 0.5 + 0.5) * SIZE);
            if (srcX >= 0 && srcX < SIZE && srcY >= 0 && srcY < SIZE) {
              dst[dIdx + ch] = src[(srcY * SIZE + srcX) * 4 + ch];
            }
          }
          dst[dIdx + 3] = 255;

          if (dist > 0.7) {
            const boost = ((dist - 0.7) / 0.3) * 0.8;
            const avg = (dst[dIdx] + dst[dIdx + 1] + dst[dIdx + 2]) / 3;
            for (let ch = 0; ch < 3; ch++) {
              dst[dIdx + ch] = Math.min(255, Math.max(0, dst[dIdx + ch] + (dst[dIdx + ch] - avg) * boost));
            }
          }
        }
      }
      glassCtx.putImageData(imageData, 0, 0);

      // Specular highlight
      const specGrad = glassCtx.createRadialGradient(
        CENTER + LIGHT_X * RADIUS * 0.45, CENTER + LIGHT_Y * RADIUS * 0.45, 0,
        CENTER + LIGHT_X * RADIUS * 0.3, CENTER + LIGHT_Y * RADIUS * 0.3, RADIUS * 0.5
      );
      specGrad.addColorStop(0, 'rgba(255,255,255,0.45)');
      specGrad.addColorStop(0.15, 'rgba(255,255,255,0.18)');
      specGrad.addColorStop(0.4, 'rgba(255,255,255,0.03)');
      specGrad.addColorStop(1, 'rgba(255,255,255,0)');
      glassCtx.fillStyle = specGrad;
      glassCtx.fillRect(0, 0, SIZE, SIZE);

      // Glint
      const glintGrad = glassCtx.createRadialGradient(
        CENTER + LIGHT_X * RADIUS * 0.33, CENTER + LIGHT_Y * RADIUS * 0.33, 0,
        CENTER + LIGHT_X * RADIUS * 0.33, CENTER + LIGHT_Y * RADIUS * 0.33, RADIUS * 0.1
      );
      glintGrad.addColorStop(0, 'rgba(255,255,255,0.65)');
      glintGrad.addColorStop(0.5, 'rgba(255,255,255,0.1)');
      glintGrad.addColorStop(1, 'rgba(255,255,255,0)');
      glassCtx.fillStyle = glintGrad;
      glassCtx.fillRect(0, 0, SIZE, SIZE);

      // Shadow
      const shadowGrad = glassCtx.createRadialGradient(CENTER, CENTER, RADIUS * 0.55, CENTER, CENTER, RADIUS);
      shadowGrad.addColorStop(0, 'rgba(0,0,0,0)');
      shadowGrad.addColorStop(0.5, 'rgba(0,0,0,0)');
      shadowGrad.addColorStop(0.8, 'rgba(0,0,0,0.12)');
      shadowGrad.addColorStop(1, 'rgba(0,0,0,0.35)');
      glassCtx.fillStyle = shadowGrad;
      glassCtx.fillRect(0, 0, SIZE, SIZE);

      // Rim light
      glassCtx.beginPath();
      glassCtx.arc(CENTER, CENTER, RADIUS - 2, 0, Math.PI * 2);
      const rimGrad = glassCtx.createLinearGradient(
        CENTER + LIGHT_X * RADIUS, CENTER + LIGHT_Y * RADIUS,
        CENTER - LIGHT_X * RADIUS, CENTER - LIGHT_Y * RADIUS
      );
      rimGrad.addColorStop(0, 'rgba(255,255,255,0.35)');
      rimGrad.addColorStop(0.25, 'rgba(255,255,255,0.08)');
      rimGrad.addColorStop(0.55, 'rgba(255,255,255,0)');
      rimGrad.addColorStop(1, 'rgba(0,0,0,0.15)');
      glassCtx.strokeStyle = rimGrad;
      glassCtx.lineWidth = 2.5;
      glassCtx.stroke();

      glassCtx.restore();
    }

    function initRive(inst) {
      inst.riveInstance = new rive.Rive({
        src: 'iconfam.riv?t=' + Date.now(),
        canvas: inst.riveCanvas,
        stateMachines: 'State Machine 1',
        autoplay: true,
        autoBind: true,
        useOffscreenRenderer: false,
        onLoad: () => {
          setTimeout(() => {
            try {
              const vmi = inst.riveInstance.viewModelInstance;
              if (vmi) {
                inst.emotionInput = vmi.number('emotion');
                if (inst.emotionInput) inst.emotionInput.value = 0;
                inst.eyeColorInput = vmi.color('eyeColor');
                if (inst.eyeColorInput) inst.eyeColorInput.value = hexToRiveColor('#ffffff');
              }
            } catch(e) {}
          }, 300);
        }
      });
    }

    // Build grid
    const grid = document.getElementById('avatars-grid');
    AVATARS.forEach((cfg, i) => {
      const { wrapper, instance } = createAvatar(cfg, i);
      grid.appendChild(wrapper);
      loadImage(cfg.src).then(img => {
        instance.sourceImage = img;
        renderGlassSphere(instance, performance.now());
      });
      initRive(instance);
    });

    // Animation loop
    function animate(time) {
      avatarInstances.forEach(inst => renderGlassSphere(inst, time));
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    // Emotion buttons (all at once)
    document.getElementById('emotion-buttons').addEventListener('click', (e) => {
      const btn = e.target.closest('.emotion-btn');
      if (!btn) return;
      document.querySelectorAll('.emotion-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const val = parseFloat(btn.dataset.val);
      avatarInstances.forEach(inst => {
        if (inst.emotionInput) inst.emotionInput.value = val;
      });
    });
  </script>
</body>
</html>
